name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) - no NPM_TOKEN secret needed
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing has hard floors of Node >=22.14.0 and npm >=11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A prerelease version (e.g. 1.1.0-beta.1) must never become `latest` -
      # publish it under the `beta` dist-tag so `npm install camunda-cloud-idac`
      # keeps resolving to the newest stable release.
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via OIDC against the Trusted Publisher configured on
      # npmjs.com for this package (Settings > Trusted Publisher > GitHub
      # Actions) - no NPM_TOKEN secret involved.
      - run: npm publish --tag ${{ steps.dist-tag.outputs.tag }} --provenance
