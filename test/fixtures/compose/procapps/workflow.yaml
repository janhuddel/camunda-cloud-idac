mappingRules:
  - mappingRuleId: map-group-workflow
    claimName: groups
    claimValue: AAD-Camunda-Workflow-${ENV_SUFFIX}
  - mappingRuleId: map-client-integration
    claimName: azp
    claimValue: ${INTEGRATION_CLIENT_ID}

groups:
  - groupId: group-workflow
    name: Gruppe Workflow
    mappingRules: [map-group-workflow]

tenants:
  - tenantId: workflow
    name: Tenant Workflow
    groups: [group-workflow]
    mappingRules: [map-client-integration]

roles:
  - roleId: process-owner
    groups: [group-workflow]
  - roleId: process-application
    mappingRules: [map-client-integration]
